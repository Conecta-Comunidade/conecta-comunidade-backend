spring.application.name=conecta-comunidade

# Spring config properties
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:${KEY_POSTGRES_PORT}/${KEY_POSTGRES_DB}
spring.datasource.username=${KEY_POSTGRES_NAME}
spring.datasource.password=${KEY_POSTGRES_PASSWORD}

#JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html