
spring.application.name=conecta-comunidade

# Spring config properties
spring.config.import=optional:file:.env[.properties]

# Server
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${KEY_POSTGRES_PORT}/${KEY_POSTGRES_DB}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${KEY_POSTGRES_NAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${KEY_POSTGRES_PASSWORD}}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
